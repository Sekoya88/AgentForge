[project]
name = "agentforge-mcp"
version = "0.1.0"
description = "stdio MCP server proxying AgentForge REST API (list agents, execute)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
agentforge-mcp = "agentforge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_mcp"]
