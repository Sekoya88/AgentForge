[project]
name = "agentforge"
version = "0.1.0"
description = "AgentForge SDK for loading and running agents locally."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "openai>=1.50.0",
    "langchain-openai",
    "langchain-google-genai",
    "langchain-ollama>=0.3.0",
    "pydantic",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
