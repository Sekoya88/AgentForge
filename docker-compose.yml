services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://forge:forge@db:5432/agentforge
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-change-me-in-production-use-long-random-string
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CORS_ALLOW_PRIVATE_NETWORK=true
      - LOG_FORMAT=dev
    labels:
      - "agentforge.service=backend"
      - "agentforge.component=api"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "[backend]"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NODE_ENV=development
    labels:
      - "agentforge.service=frontend"
      - "agentforge.component=ui"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "[frontend]"
    volumes:
      - ./frontend:/app
      # Named volumes: reliably seeded from the image; anonymous vols can stay empty vs bind mount.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    # Fill named volume on first run / after new deps; skip when react-markdown already present.
    command: sh -c "if ! test -f node_modules/react-markdown/package.json; then npm ci; fi; exec npm run dev"

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: agentforge
    # Log slow queries (>200ms), connections, and disconnections
    command: >
      postgres
      -c log_min_duration_statement=200
      -c log_connections=on
      -c log_disconnections=on
      -c log_line_prefix='[db] %t [%p] %u@%d '
      -c log_timezone=UTC
    labels:
      - "agentforge.service=db"
      - "agentforge.component=database"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "[db]"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d agentforge"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      - "agentforge.service=redis"
      - "agentforge.component=cache"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        tag: "[redis]"
    ports:
      # Host 6380 avoids clash with a local Redis already bound to 6379
      - "6380:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agentforge.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    labels:
      - "agentforge.service=pgadmin"
      - "agentforge.component=tools"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        tag: "[pgadmin]"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
