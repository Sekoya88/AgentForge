[project]
name = "agentforge-client"
version = "0.1.0"
description = "HTTP client for the AgentForge REST API (typed helpers; regenerate types from openapi/openapi.json)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_client"]
